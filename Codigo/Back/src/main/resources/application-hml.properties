# Banco de dados de Homologação (Aiven).
# Variáveis lidas do .env: HML_MYSQLHOST, HML_MYSQLPORT, HML_MYSQLDATABASE,
# HML_MYSQLUSER, HML_MYSQLPASSWORD.
spring.datasource.url=jdbc:mysql://${HML_MYSQLHOST}:${HML_MYSQLPORT}/${HML_MYSQLDATABASE}?ssl-mode=REQUIRED&serverTimezone=America/Sao_Paulo
spring.datasource.username=${HML_MYSQLUSER}
spring.datasource.password=${HML_MYSQLPASSWORD}

spring.jpa.hibernate.ddl-auto=none
