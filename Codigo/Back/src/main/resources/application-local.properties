# Banco de dados local (ex.: MySQL do docker-compose ou instalado na máquina).
# Variáveis lidas do .env: LOCAL_MYSQLHOST, LOCAL_MYSQLPORT, LOCAL_MYSQLDATABASE,
# LOCAL_MYSQLUSER, LOCAL_MYSQLPASSWORD.
spring.datasource.url=jdbc:mysql://${LOCAL_MYSQLHOST}:${LOCAL_MYSQLPORT}/${LOCAL_MYSQLDATABASE}?createDatabaseIfNotExist=true&serverTimezone=America/Sao_Paulo&useSSL=false&allowPublicKeyRetrieval=true&autoReconnect=true&failOverReadOnly=false&maxReconnects=10
spring.datasource.username=${LOCAL_MYSQLUSER}
spring.datasource.password=${LOCAL_MYSQLPASSWORD}

# Cria/atualiza o schema automaticamente em ambiente local
spring.jpa.hibernate.ddl-auto=update

# ==============================
# 🔹 CONFIG. DE URLS
# ==============================
frontend.url=${LOCAL_FRONTEND_URL}
backend.url=${LOCAL_BACKEND_URL}

# ==============================
# 🔹 CONFIG. DE FOCUS NFE
# ==============================
# Não há sandbox própria para local — reaproveita as credenciais de homologação da Focus NFe.
focus.nfe.token=${HML_FOCUS_NFE_TOKEN}
focus.nfe.api.url=${HML_FOCUS_NFE_API_URL}

# ==============================
# 🔹 CONFIG. DE R2 (CLOUDFLARE)
# ==============================
r2.account-id=${LOCAL_R2_ACCOUNT_ID}
r2.access-key-id=${LOCAL_R2_ACCESS_KEY_ID}
r2.secret-access-key=${LOCAL_R2_SECRET_ACCESS_KEY}
r2.bucket-name=${LOCAL_R2_BUCKET_NAME}
r2.endpoint=${LOCAL_R2_ENDPOINT}

# ==============================
# 🔹 CONFIG. DO BANCO DO BRASIL (API Extratos)
# ==============================
# Não há sandbox própria para local — reaproveita as credenciais de homologação do BB.
bb.ambiente=${LOCAL_BB_AMBIENT}
bb.app-key=${LOCAL_BB_APP_KEY}
bb.basic=${LOCAL_BB_BASIC}
bb.scope=${LOCAL_BB_SCOPE}
bb.agencia=${LOCAL_BB_AGENCIA}
bb.conta=${LOCAL_BB_CONTA}
bb.mciteste=${LOCAL_BB_MCITESTE}