# Banco de dados local (ex.: MySQL do docker-compose ou instalado na máquina).
# Variáveis lidas do .env: LOCAL_MYSQLHOST, LOCAL_MYSQLPORT, LOCAL_MYSQLDATABASE,
# LOCAL_MYSQLUSER, LOCAL_MYSQLPASSWORD.
spring.datasource.url=jdbc:mysql://${LOCAL_MYSQLHOST}:${LOCAL_MYSQLPORT}/${LOCAL_MYSQLDATABASE}?createDatabaseIfNotExist=true&serverTimezone=America/Sao_Paulo&useSSL=false&allowPublicKeyRetrieval=true&autoReconnect=true&failOverReadOnly=false&maxReconnects=10
spring.datasource.username=${LOCAL_MYSQLUSER}
spring.datasource.password=${LOCAL_MYSQLPASSWORD}

# Cria/atualiza o schema automaticamente em ambiente local
spring.jpa.hibernate.ddl-auto=update
