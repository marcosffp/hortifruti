spring.application.name=Hortifruti SL
# Ambiente ativo: local (padrão), hml ou prod. Troque só isso (via .env, variável de
# ambiente SPRING_PROFILES_ACTIVE, ou -Dspring.profiles.active=hml) para apontar a
# aplicação para o banco correto — veja application-local/hml/prod.properties.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}
server.port=8080
spring.config.import=optional:file:.env[.properties]

# ==============================
# 🔹 CONFIG. DE URLS
# ==============================

# frontend.url e backend.url variam por ambiente — definidos em
# application-local.properties, application-hml.properties e application-prod.properties.

# ==============================
# 🔹 CONFIG. DE BANCO DE DADOS
# ==============================

# A URL/usuário/senha do banco (e o ddl-auto) ficam em application-{profile}.properties,
# um arquivo por ambiente — veja application-local.properties, application-hml.properties
# e application-prod.properties. Aqui só o que é comum aos três:

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Configurações melhoradas do HikariCP
spring.datasource.hikari.connection-timeout=60000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.leak-detection-threshold=60000
spring.datasource.hikari.initialization-fail-timeout=-1
spring.datasource.hikari.validation-timeout=3000


# Testa conexões antes de usar
spring.datasource.hikari.connection-test-query=SELECT 1

# MySQL específico
spring.datasource.hikari.data-source-properties.cachePrepStmts=true
spring.datasource.hikari.data-source-properties.prepStmtCacheSize=250
spring.datasource.hikari.data-source-properties.prepStmtCacheSqlLimit=2048

# ==============================
# 🔹 CONFIG. DE AUTENTICAÇÃO
# ==============================

# Configuração do JWT
jwt.secret=${JWT_SECRET}

# Cookie HttpOnly do JWT: em local (http, mesmo "site" via localhost) Secure=false e
# SameSite=Lax bastam; hml/prod sobrescrevem para Secure=true e SameSite=None (front e
# back ficam em domínios diferentes).
auth.cookie.secure=false
auth.cookie.samesite=Lax

# Configuração do token de acesso aos endpoints do scheduler
api.token.scheduler=${API_SCHEDULER_TOKEN}



# ==============================
# 🔹 CONFIG. DE GOOGLE
# ==============================

# Configuração do Google Maps API
google.maps.api.key=${CREDENTIALS_GOOGLE}

# Configuração do Google Drive API
google.drive.credentials=${GOOGLE_DRIVE_CREDENTIALS}
# O endpoint de callback é fixo (GET /backup/oauth2callback — BackupController), então a
# URI de redirect só precisa do backend.url de cada ambiente, sem variável própria no .env.
google.redirect.uri=${backend.url}/backup/oauth2callback

#Configuração de diretório 
google.tokens.directory=temp/google/tokens
google.temp.directory=temp/google



# ==============================
# 🔹 CONFIG. DE SICOOB
# ==============================

# Configuração do Sicoob API
sicoob.client.id=${SICOOB_CLIENT_ID}
sicoob.api.url=${SICOOB_API_URL}
sicoob.auth.url=${SICOOB_AUTH_URL}
sicoob.scope=${SICOOB_SCOPE}
sicoob.num.cliente=${SICOOB_NUM_CLIENTE}
sicoob.num.conta.corrente=${SICOOB_NUM_CONTA_CORRENTE}

# Configuração de certificado
document.pfx=${DOCUMENT_PFX}
password.pfx=${PASSWORD_PFX}
document.pem=${DOCUMENT_PEM:}

# Configuração de diretório
pfx.temp.directory=temp/cert
pem.temp.directory=temp/cert/bb_upload



# ==============================
# 🔹 CONFIG. DO BANCO DO BRASIL (API Extratos)
# ==============================

# Reaproveita o mesmo certificado mTLS (document.pfx/password.pfx) usado no Sicoob acima.
bb.ambiente=${BB_AMBIENT}
bb.app-key=${BB_APP_KEY}
bb.basic=${BB_BASIC}
bb.scope=${BB_SCOPE:extrato-info}
bb.agencia=${BB_AGENCIA}
bb.conta=${BB_CONTA}
# Somente usado quando bb.ambiente=hml
bb.mciteste=${BB_MCITESTE:}
# Evita esgotar o limite de 10 chamadas/10min da API do BB quando varios gerentes
# abrem o dashboard ao mesmo tempo.
bb.saldo.cache.ttl.seconds=120



# ==============================
# 🔹 CONFIG. DE OPENWEATHER
# ==============================

# Configurações do OpenWeather API
app.openweather.apiKey=${API_TOKEN}
app.openweather.forecastUrl=${API_URL}
app.openweather.city=Santa Luzia,MG,BR
app.openweather.units=metric
app.openweather.lang=pt_br



# ==============================
# 🔹 CONFIG. DE FOCUS NFE
# ==============================

# Configurações do Focus NFe API
# focus.nfe.token e focus.nfe.api.url variam por ambiente — definidos em
# application-local.properties, application-hml.properties e application-prod.properties.
focus.nfe.cnpj.emitente=${FOCUS_NFE_CNPJ_EMITENTE}

# Configuração de certificado
company.name=${COMPANY_NAME}
company.state.registration=${COMPANY_STATE_REGISTRATION}
company.cnpj=${COMPANY_CNPJ}
zip.password.enabled=false



# ==============================
# 🔹 CONFIG. DE NOTIFICAÇÃO
# ==============================

# Configuração do Ultramsg API
ultramsg.token=${ULTRAMSG_TOKEN}
ultramsg.instance.id=${ULTRAMSG_INSTANCE_ID}
ultramsg.base.url=https://api.ultramsg.com/

# Segredo compartilhado usado para validar que chamadas a /chatbot/webhook realmente
# vêm da UltraMsg (configurar o mesmo valor como query param "token" na URL do webhook
# cadastrada no painel da UltraMsg).
chatbot.webhook.secret=CHATBOT_WEBHOOK_SECRET

# Provedor de envio de email ativo: sendgrid | gmail | gmail-api
# Troque via variável de ambiente EMAIL_PROVIDER sem precisar alterar código.
# gmail = SMTP direto (requer porta 587/465 liberada no host de deploy)
# gmail-api = Gmail via API HTTPS, usa a mesma autorização OAuth do backup do Google Drive
email.provider=${EMAIL_PROVIDER:sendgrid}

# Configuração do SendGrid API
sendgrid.api.key=${SENDGRID_API_KEY:}
sendgrid.from.email=${SENDGRID_FROM_EMAIL:}

# Configuração do Gmail SMTP (usado quando email.provider=gmail)
gmail.smtp.host=${GMAIL_SMTP_HOST:smtp.gmail.com}
gmail.smtp.port=${GMAIL_SMTP_PORT:587}
gmail.smtp.connection-timeout-ms=${GMAIL_SMTP_CONNECTION_TIMEOUT_MS:10000}
gmail.smtp.timeout-ms=${GMAIL_SMTP_TIMEOUT_MS:10000}

# Nome exibido na assinatura dos emails enviados a clientes
notification.sender-name=${NOTIFICATION_SENDER_NAME:}

# Configuração de Email Destinatário - Contabilidade
accounting.email=${ACCOUNTING_EMAIL}

# Configuração de WhatsApp Remetente
accounting.whatsapp=${ACCOUNTING_WHATSAPP}

# Configurações de emails Destinatários
overdue.notification.emails=${OVERDUE_NOTIFICATION_EMAILS}

# Configurações de Diretório
temp.directory=temp/notifications

# Configura o formato padrão de datas no JSON
spring.jackson.date-format=dd/MM/yyyy
spring.jackson.time-zone=America/Sao_Paulo

# ==============================
# 🔹 CONFIG. DE UPLOAD DE ARQUIVO
# ==============================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# ==============================
# 🔹 CONFIG. DE CLOUDFLARE R2
# ==============================
# Todo arquivo gerado/recebido pelo sistema (boletos, notas fiscais, extratos) é
# salvo neste bucket. r2.environment prefixa as chaves para não misturar
# arquivos de dev/hml/prod no mesmo bucket — reaproveita SPRING_PROFILES_ACTIVE.
r2.account-id=${R2_ACCOUNT_ID}
r2.access-key-id=${R2_ACCESS_KEY_ID}
r2.secret-access-key=${R2_SECRET_ACCESS_KEY}
r2.bucket-name=${R2_BUCKET_NAME}
r2.endpoint=${R2_ENDPOINT}
r2.environment=${SPRING_PROFILES_ACTIVE:local}

#debug=true