# Banco de dados de Produção (Railway).
# Em produção o Railway injeta MYSQLHOST/MYSQLPORT/MYSQLDATABASE/MYSQLUSER/MYSQLPASSWORD
# diretamente no container. Para acessar o mesmo banco a partir da máquina local
# (ex.: consultar dados reais), defina essas mesmas variáveis no .env apontando para o
# proxy público do Railway (MYSQLHOST=<algo>.proxy.rlwy.net, porta pública do proxy).
spring.datasource.url=jdbc:mysql://${MYSQLHOST}:${MYSQLPORT}/${MYSQLDATABASE}?createDatabaseIfNotExist=true&serverTimezone=America/Sao_Paulo&useSSL=true&requireSSL=true
spring.datasource.username=${MYSQLUSER}
spring.datasource.password=${MYSQLPASSWORD}

spring.jpa.hibernate.ddl-auto=none

# Front e back ficam em domínios diferentes em produção — cookie precisa ser cross-site.
auth.cookie.secure=true
auth.cookie.samesite=None
